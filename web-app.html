<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      input {
        margin: 10px 0;
        padding: 8px;
        width: 100px;
      }
      button {
        padding: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Weight Tracker</h2>
    <button onclick="connectBLE()">1. Connect Arduino</button>
    <p id="status">Status: Disconnected</p>
    <hr />

    <label>Start Weight:</label><br />
    <input type="number" id="startInput" step="0.1" min="0" /><button
      onclick="sendWeight('start')"
    >
      Send</button
    ><br />

    <label>Goal Weight:</label><br />
    <input type="number" id="goalInput" step="0.1" min="0" /><button
      onclick="sendWeight('goal')"
    >
      Send</button
    ><br />

    <label>Current Weight:</label><br />
    <input type="number" id="currentInput" step="0.1" min="0" /><button
      onclick="sendWeight('current')"
    >
      Send
    </button>

    <label>Progress:</label><br />
    <input
      type="number"
      id="progressInput"
      step="0.1"
      min="0"
      max="100"
      disabled
    />

    <hr />
    <button
      onclick="resetWeights()"
      style="background-color: #ff4444; color: white"
    >
      Reset All Saved Data
    </button>

    <script>
      let chars = {};
      const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
      const UUIDS = {
        start: "19b10002-e8f2-537e-4f6c-d104768a1214",
        goal: "19b10003-e8f2-537e-4f6c-d104768a1214",
        current: "19b10004-e8f2-537e-4f6c-d104768a1214",
        progress: "19b10005-e8f2-537e-4f6c-d104768a1214",
        reset: "19b10006-e8f2-537e-4f6c-d104768a1214",
      };

      async function connectBLE() {
        try {
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "NanoESP32_WeightTracker" }],
            optionalServices: [SERVICE_UUID],
          });
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);

          // Map all characteristics
          chars.start = await service.getCharacteristic(UUIDS.start);
          chars.goal = await service.getCharacteristic(UUIDS.goal);
          chars.current = await service.getCharacteristic(UUIDS.current);
          chars.progress = await service.getCharacteristic(UUIDS.progress);
          chars.reset = await service.getCharacteristic(UUIDS.reset);

          document.getElementById("status").innerText =
            "Status: Connected! Syncing...";

          await pullWeights();

          document.getElementById("status").innerText =
            "Status: Ready & Synced!";
        } catch (e) {
          document.getElementById("status").innerText = "Error: " + e;
        }
      }

      async function pullWeights() {
        try {
          // Read each value from the Arduino
          const startData = await chars.start.readValue();
          const goalData = await chars.goal.readValue();
          const currentData = await chars.current.readValue();
          const progressData = await chars.progress.readValue();

          // Update the input fields with the retrieved values
          document.getElementById("startInput").value = new DataView(
            startData.buffer,
          )
            .getFloat32(0, true)
            .toFixed(1);
          document.getElementById("goalInput").value = new DataView(
            goalData.buffer,
          )
            .getFloat32(0, true)
            .toFixed(1);
          document.getElementById("currentInput").value = new DataView(
            currentData.buffer,
          )
            .getFloat32(0, true)
            .toFixed(1);
          document.getElementById("progressInput").value = new DataView(
            progressData.buffer,
          )
            .getFloat32(0, true)
            .toFixed(1);

          console.log("Weights synced from Arduino.");
        } catch (e) {
          console.error("Sync failed: ", e);
        }
      }

      async function sendWeight(type) {
        if (!chars[type]) return alert("Connect first!");
        const val = parseFloat(document.getElementById(type + "Input").value);

        // Safety check for non-negative number.
        if (isNaN(val) || val < 0) {
          alert("Please enter a positive weight.");
          return;
        }

        // Convert float to 4-byte buffer
        const buffer = new Float32Array([val]).buffer;
        await chars[type].writeValue(buffer);
        console.log(`Sent ${type}: ${val}`);
      }

      async function resetWeights() {
        if (!chars.reset) return alert("Connect first!");
        if (
          confirm(
            "Are you sure you want to wipe all saved weights from the Arduino?",
          )
        ) {
          const data = new Uint8Array([1]);
          await chars.reset.writeValue(data);
          alert("Reset signal sent!");

          document.getElementById("startInput").value = "";
          document.getElementById("goalInput").value = "";
          document.getElementById("currentInput").value = "";
        }
      }
    </script>
  </body>
</html>
